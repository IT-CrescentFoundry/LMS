# Alembic configuration for the Crescent Foundry LMS.
#
# The database URL is NOT stored here. alembic/env.py reads it from the LMS_DB_*
# settings (environment variables or LMS_Backend/.env). There is no fallback
# database: if the settings are missing, Alembic stops with an error.
#
# Run Alembic from the LMS_Backend directory, e.g.
#   .venv\Scripts\python -m alembic current

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Migration filenames: 2026_11_12_1430-<rev>_<slug>.py (sortable by date).
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
