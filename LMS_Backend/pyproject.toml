[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crescent-lms-backend"
version = "0.1.0"
description = "Crescent Foundry Learning Management System - backend API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.162.5,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "pydantic>=2.14.3,<3.0",
    "pydantic-settings>=2.16.2,<3.0",
    "sqlalchemy>=2.1.8,<2.2",
    "alembic>=1.20.1,<2.0",
    # PyMySQL is a pure-Python MySQL driver. The "rsa" extra installs
    # `cryptography`, required for MySQL 8's default caching_sha2_password
    # authentication over non-TLS connections.
    "pymysql[rsa]>=1.2.4,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0",
    # HTTPX 2.x (published as "httpx2"); required by Starlette's TestClient.
    "httpx2>=2.16.0,<3.0",
    "ruff>=0.17.4,<0.18",
    "mypy>=2.4.1,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "N",        # naming
    "RUF",      # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not make the alembic package look first-party.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and dummy test credentials are fine in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic/env.py"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
